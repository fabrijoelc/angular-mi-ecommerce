<header class="relative bg-slate-900 text-white overflow-hidden">
  <img
    src="images/hero-cancha.jpg"
    alt="Cancha de basquet"
    class="absolute inset-0 w-full h-full object-cover opacity-20"
  />

  <div class="relative max-w-7xl mx-auto px-4 sm:px-6 py-5 flex flex-col sm:flex-row flex-wrap items-center justify-between gap-4">
    <a routerLink="/" class="flex items-center gap-3">
      <span class="text-3xl">🏀</span>
      <div>
        <h1 class="text-2xl font-bold">Tienda de Jerseys NBA</h1>
        <p class="text-sm text-slate-400">Camisetas oficiales · Lima, Perú</p>
      </div>
    </a>

    <nav class="flex flex-wrap items-center justify-center gap-2">
      <a
        routerLink="/"
        routerLinkActive="bg-white text-slate-900"
        [routerLinkActiveOptions]="{ exact: true }"
        class="px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-700 transition-colors"
      >
        Inicio
      </a>

      <a
        routerLink="/catalogo"
        routerLinkActive="bg-white text-slate-900"
        class="px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-700 transition-colors"
      >
        Catálogo
      </a>

      <a
        routerLink="/carrito"
        routerLinkActive="bg-white text-slate-900"
        class="px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-700 transition-colors"
      >
        Carrito ({{ carritoService.cantidadDeItems() }})
      </a>

      @if (authService.usuario()) {
        <a
          routerLink="/mis-compras"
          routerLinkActive="bg-white text-slate-900"
          class="px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-700 transition-colors"
        >
          Mis compras
        </a>

        <span class="px-3 py-2 text-sm text-emerald-400">
          Hola, {{ authService.usuario()!.nombre || authService.usuario()!.email }}
        </span>

        <button
          type="button"
          class="px-4 py-2 rounded-lg text-sm font-medium bg-slate-700 hover:bg-slate-600 transition-colors"
          (click)="cerrarSesion()"
        >
          Cerrar sesion
        </button>
      } @else {
      <a
        routerLink="/login"
        routerLinkActive="bg-white text-slate-900"
        class="px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-700 transition-colors"
      >
        Iniciar sesión
      </a>

      <a
        routerLink="/registro"
        routerLinkActive="bg-white text-slate-900"
        class="px-4 py-2 rounded-lg text-sm font-medium bg-emerald-500 hover:bg-emerald-400 transition-colors"
      >
        Crear cuenta
      </a>
      }
    </nav>
  </div>
</header>
